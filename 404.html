<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex">
  <title>404 — ROUNDIE</title>
  <meta name="description" content="お探しのページが見つかりませんでした。">
  <link rel="canonical" href="https://roundie.app/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230A0A0A'/><text x='50' y='65' font-family='Arial Black' font-weight='900' font-size='44' fill='%235BAF52' text-anchor='middle'>R</text></svg>">
  <style>
  :root{
    --bg:#0A0A0A;--green:#2D5A27;--green-on-dark:#7FCF6F;
    --t1:#FFFFFF;--t2:#A8A8A8;--t3:#7A7A7A;
    --font-display:"Arial Black","Helvetica Neue",system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-body);
    background:var(--bg); color:var(--t1);
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  main{max-width:600px}
  .err{
    font-family:var(--font-display); font-weight:900;
    font-size:clamp(96px,22vw,220px); line-height:.9; letter-spacing:-.04em;
    color:var(--green-on-dark);
    margin-bottom:24px;
  }
  h1{
    font-family:var(--font-display); font-weight:900;
    font-size:clamp(24px,3.6vw,40px); line-height:1.2; letter-spacing:.02em;
    margin-bottom:16px;
  }
  p{
    font-size:clamp(15px,1.8vw,18px); color:var(--t2); line-height:1.7;
    margin-bottom:48px; max-width:36ch; margin-left:auto;margin-right:auto;
  }
  .cta{
    display:inline-flex; align-items:center; gap:12px;
    padding:18px 32px;
    background:var(--green); color:var(--t1);
    font-family:var(--font-display); font-weight:900;
    font-size:13px; letter-spacing:.18em;
    border:2px solid var(--green);
    text-decoration:none;
    min-height:56px;
    transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s;
  }
  @media (hover:hover){
    .cta:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--green-on-dark)}
  }
  .cta:focus-visible{outline:2px solid var(--green-on-dark);outline-offset:4px}
  .mini{margin-top:32px;font-size:11px;color:var(--t3);letter-spacing:.16em;font-family:var(--font-display);font-weight:900}
  .mini a{color:var(--t3);text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <div class="err" aria-hidden="true">404</div>
    <h1>お探しのページが見つかりませんでした。</h1>
    <p>URL をご確認いただくか、トップページからお探しください。<br>The page you requested could not be found.</p>
    <a href="/" class="cta">
      <span>BACK TO ROUNDIE</span>
      <span aria-hidden="true">→</span>
    </a>
    <div class="mini">
      <a href="/faq/">FAQ</a> · <a href="mailto:roundie@kanopy-inc.com">CONTACT</a>
    </div>
  </main>
</body>
</html>
