<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROUNDIE — あなたのラウンドを、かたちに残す。</title>
<meta name="description" content="スコアじゃない、瞬間を残すゴルフ。ゴルファーのソーシャルアプリ ROUNDIE。">

<!-- hreflang × 3 + x-default -->
<link rel="alternate" hreflang="ja"        href="https://roundie.app/ja/">
<link rel="alternate" hreflang="en"        href="https://roundie.app/en/">
<link rel="alternate" hreflang="ko"        href="https://roundie.app/ko/">
<link rel="alternate" hreflang="x-default" href="https://roundie.app/ja/">

<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:title" content="ROUNDIE — あなたのラウンドを、かたちに残す。">
<meta property="og:description" content="スコアじゃない、瞬間を残すゴルフ。">
<meta property="og:image" content="https://roundie.app/og/card-1200x630.ja.avif">
<meta name="twitter:card" content="summary_large_image">

<!-- JSON-LD: 5 種を埋め込み (src/structured-data/*.json を結合) -->
<script type="application/ld+json">
  /* @placeholder: build step inlines src/structured-data/organization.json */
</script>

<!-- Critical CSS inline (~6KB target) -->
<style id="critical">
  /* build step inlines src/styles/critical.css here */
</style>

<!-- Preload main CSS -->
<link rel="preload" href="/assets/styles.css" as="style" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/assets/styles.css"></noscript>

<!-- Preload fonts -->
<link rel="preload" href="/fonts/shippori-mincho-b1.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-sans-jp.subset.woff2"      as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.var.woff2"                as="font" type="font/woff2" crossorigin>

<!-- Tokens -->
<link rel="stylesheet" href="/src/tokens/tokens.css">

<!-- Motion -->
<link rel="stylesheet" href="/src/motion/kt-a-breath.css">
<link rel="stylesheet" href="/src/motion/kt-c-pulse.css">
<link rel="stylesheet" href="/src/motion/sc-a-fade.css">
<link rel="stylesheet" href="/src/motion/rc-form.css">
<link rel="stylesheet" href="/src/motion/mi-states.css">
<link rel="stylesheet" href="/src/motion/reduced-motion.css">
</head>

<body>

<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-header">
  <a href="/" aria-label="ROUNDIE home"><b class="brand">ROUNDIE</b></a>
  <nav aria-label="Language">
    <form method="get" action="/ja/" data-i18n-switch>
      <button type="submit" name="lang" value="ja">日本語</button>
      <button type="submit" name="lang" value="en">English</button>
      <button type="submit" name="lang" value="ko">한국어</button>
    </form>
  </nav>
</header>

<main id="main">

  <!-- ============= 01 HERO ============= -->
  <section class="hero" aria-labelledby="hero-h1">
    <p class="eyebrow" data-i18n="s01_hero.eyebrow">A KANOPY PRODUCT</p>
    <h1 id="hero-h1" data-i18n-html="s01_hero.h1_html" data-i18n-aria="s01_hero.h1_plain">
      あなたのラウンドを、<br><em>かたちに残す</em><span class="punct">。</span>
    </h1>
    <p class="lede" data-i18n="s01_hero.sub">スコアじゃない、瞬間を残すゴルフ。</p>
    <p class="cta-row">
      <a class="cta" href="#early-access" data-event="hero_cta_click" data-i18n="s01_hero.cta_primary">先行申し込みはこちらから</a>
      <a class="cta cta-secondary" href="#features" data-i18n="s01_hero.cta_secondary">Round Card を見る</a>
    </p>
    <p class="cta-hint" data-i18n="s01_hero.cta_primary_hint">※ リンク先は今後決定。ご案内をお送りします。</p>
  </section>

  <!-- ============= 02 VISION ============= -->
  <section class="vision" aria-labelledby="vision-h2">
    <p class="eyebrow" data-i18n="s02_vision.eyebrow">VISION</p>
    <h2 id="vision-h2" data-i18n="s02_vision.h2">ゴルフは、スコアだけじゃない。</h2>
    <ol class="scenes" data-i18n-loop="s02_vision.scenes">
      <li class="scene">
        <h3 data-i18n-prop="title"></h3>
        <p data-i18n-prop="body"></p>
      </li>
    </ol>
    <p class="vision-close" data-i18n="s02_vision.closing"></p>
  </section>

  <!-- ============= 03 HOW IT WORKS ============= -->
  <section class="how" aria-labelledby="how-h2">
    <p class="eyebrow" data-i18n="s03_how.eyebrow">HOW IT WORKS</p>
    <h2 id="how-h2" data-i18n="s03_how.h2"></h2>
    <p class="sub" data-i18n="s03_how.sub"></p>
    <ol class="steps" data-i18n-loop="s03_how.steps">
      <li class="step">
        <span class="num" data-i18n-prop="num"></span>
        <h3 data-i18n-prop="verb"></h3>
        <p data-i18n-prop="body"></p>
      </li>
    </ol>
  </section>

  <!-- ============= 04 FEATURES (Bento) ============= -->
  <section id="features" class="features" aria-labelledby="features-h2">
    <p class="eyebrow" data-i18n="s04_features.eyebrow">FEATURES</p>
    <h2 id="features-h2" data-i18n="s04_features.h2"></h2>
    <p class="sub" data-i18n="s04_features.sub"></p>
    <ul class="bento" data-i18n-loop="s04_features.bento">
      <li class="bento-card" data-size-from="size" data-feature-from="id">
        <h3 data-i18n-prop="title"></h3>
        <p data-i18n-prop="body"></p>
      </li>
    </ul>
    <!-- Round Card 18-cell demo (RC-FORM) -->
    <div class="round-card" aria-label="あなたの 18 ホール">
      <!-- build step generates 18 <div class="cell" style="--i:N"></div> -->
    </div>
  </section>

  <!-- ============= 05 ROUNDIE Score ============= -->
  <section class="score" aria-labelledby="score-h2">
    <p class="eyebrow" data-i18n="s05_score.eyebrow">ROUNDIE SCORE</p>
    <h2 id="score-h2" data-i18n="s05_score.h2"></h2>
    <p class="sub" data-i18n="s05_score.sub"></p>
    <ul class="axes" data-i18n-loop="s05_score.axes">
      <li>
        <span class="axis-label" data-i18n-prop="label"></span>
        <span class="axis-desc"  data-i18n-prop="description"></span>
        <!-- ISS-05: aria-label + label + stripe overlay -->
        <progress max="100" value="0" data-i18n-aria-prop="a11y_label"></progress>
      </li>
    </ul>
  </section>

  <!-- ============= 06 UGC Feed ============= -->
  <section class="ugc" aria-labelledby="ugc-h2">
    <p class="eyebrow" data-i18n="s06_ugc.eyebrow">FEED</p>
    <h2 id="ugc-h2" data-i18n="s06_ugc.h2"></h2>
    <p class="sub" data-i18n="s06_ugc.sub"></p>
    <p class="iss07-disclosure" data-i18n="s06_ugc.iss07_disclosure" role="note"></p>
    <ul class="feed">
      <!-- build step injects 3 placeholder posts during β-first 14 days -->
    </ul>
  </section>

  <!-- ============= 07 KUDOS ============= -->
  <section class="kudos" aria-labelledby="kudos-h2">
    <p class="eyebrow" data-i18n="s07_kudos.eyebrow">KUDOS</p>
    <h2 id="kudos-h2" data-i18n="s07_kudos.h2"></h2>
    <p class="sub" data-i18n="s07_kudos.sub"></p>
    <ul class="kudos-cards" data-i18n-loop="s07_kudos.kudos">
      <li>
        <button class="kudos-btn" data-color-from="color" data-event="kudos_tap_demo" data-kudos-type-from="id">
          <span data-i18n-prop="label"></span>
        </button>
        <p data-i18n-prop="description"></p>
      </li>
    </ul>
  </section>

  <!-- ============= 08 COMPETITION ============= -->
  <section class="compe" aria-labelledby="compe-h2">
    <p class="eyebrow" data-i18n="s08_compe.eyebrow">COMPETITION</p>
    <h2 id="compe-h2" data-i18n="s08_compe.h2_a"></h2>
    <p data-i18n="s08_compe.sub_a"></p>
    <h2 data-i18n="s08_compe.h2_b"></h2>
    <p data-i18n="s08_compe.sub_b"></p>
    <ul class="awards" data-i18n-loop-flat="s08_compe.awards"></ul>
  </section>

  <!-- ============= 09 PRICING ============= -->
  <section id="pricing" class="pricing" aria-labelledby="pricing-h2">
    <p class="eyebrow" data-i18n="s09_pricing.eyebrow">PRICING</p>
    <h2 id="pricing-h2" data-i18n="s09_pricing.h2"></h2>
    <p class="sub" data-i18n="s09_pricing.sub"></p>
    <ul class="plans" data-i18n-loop="s09_pricing.plans">
      <li class="plan">
        <h3 data-i18n-prop="name"></h3>
        <p class="price" data-i18n-prop="price_label"></p>
        <p data-i18n-prop="tagline"></p>
        <ul class="plan-features" data-prop-loop="features"></ul>
      </li>
    </ul>
  </section>

  <!-- ============= 10 FAQ + EARLY ACCESS + ANDROID ============= -->
  <section id="faq" class="faq" aria-labelledby="faq-h2">
    <p class="eyebrow" data-i18n="s10_faq.eyebrow">FAQ</p>
    <h2 id="faq-h2" data-i18n="s10_faq.h2"></h2>
    <p class="sub" data-i18n="s10_faq.sub"></p>

    <ul class="faq-items" data-i18n-loop="s10_faq.items">
      <li>
        <details>
          <summary><span data-i18n-prop="q"></span><span class="arrow" aria-hidden="true">+</span></summary>
          <p data-i18n-prop="a"></p>
        </details>
      </li>
    </ul>

    <!-- Early access form -->
    <form id="early-access" class="form-card" method="post" action="/api/early-access" data-event="early_access_signup">
      <label data-i18n="s10_faq.early_access.label">先行申し込み</label>
      <input type="email" name="email" required data-i18n-placeholder="s10_faq.early_access.placeholder_email">
      <button class="cta" type="submit" data-i18n="s10_faq.early_access.cta">申し込む</button>
      <p class="hint" data-i18n="s10_faq.early_access.hint"></p>
    </form>

    <!-- Android waitlist -->
    <form class="form-card waitlist" method="post" action="/api/android-waitlist" data-event="android_waitlist_submit">
      <h3 data-i18n="s10_faq.android_waitlist.h3"></h3>
      <p data-i18n="s10_faq.android_waitlist.sub"></p>
      <input type="email" name="email" required data-i18n-placeholder="s10_faq.android_waitlist.placeholder_email">
      <button class="cta cta-secondary" type="submit" data-i18n="s10_faq.android_waitlist.cta">通知を受け取る</button>
    </form>
  </section>

</main>

<!-- ============= 11 FOOTER ============= -->
<footer class="footer">
  <h2 data-i18n="s11_footer.h2"></h2>
  <p data-i18n="s11_footer.sub"></p>
  <p class="cta-row">
    <a class="cta" href="#early-access" data-event="hero_cta_click" data-cta-location="footer" data-i18n="s11_footer.cta_primary"></a>
    <a class="cta cta-secondary" href="#faq" data-i18n="s11_footer.cta_secondary"></a>
  </p>
  <small class="kanopy-byline" data-i18n="s11_footer.kanopy_byline">A KANOPY PRODUCT</small>
  <nav class="legal" aria-label="Legal">
    <ul data-i18n-loop="s11_footer.legal">
      <li><a data-href-from="href" data-i18n-prop="label"></a></li>
    </ul>
  </nav>
</footer>

<!-- Scripts (defer, JS is enhancement only) -->
<script src="/src/scripts/i18n.js" defer></script>
<script src="/src/scripts/analytics.js" defer></script>
<script src="/src/scripts/faq.js" defer></script>
<script src="/src/scripts/kudos-demo.js" defer></script>

</body>
</html>
